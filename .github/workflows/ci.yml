name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # semanal: detecta si un SDK o dependencia rompe un ejemplo

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [webhook-express, bulk-issue-node, payment-link]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  nextjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-invoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [webhook-fastapi, bulk-issue-python, ai-agent-mcp]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check --config ../ruff.toml .
      - run: pytest -q
